create or replace function public.ds_touch() returns trigger
language plpgsql as $$
begin
  new.updated_at := now();
  return new;
end $$;

do $$
declare
  t text;
  tables text[] := array[
    'categories','products','inventory','movements','bundles',
    'customers','users','transactions','items','expenses','settings'
  ];
begin
  foreach t in array tables loop
    -- 1 tabel per entitas: id + isi record (JSON) + penanda hapus + waktu ubah dari server
    execute format($f$
      create table if not exists public.ds_%1$s (
        id         text primary key,
        data       jsonb       not null default '{}'::jsonb,
        deleted    boolean     not null default false,
        updated_at timestamptz not null default now()
      )$f$, t);

    execute format('create index if not exists ds_%1$s_updated_idx on public.ds_%1$s (updated_at)', t);

    -- waktu ubah selalu diisi server (tidak bergantung jam HP/laptop)
    execute format('drop trigger if exists ds_%1$s_touch on public.ds_%1$s', t);
    execute format($f$
      create trigger ds_%1$s_touch before insert or update on public.ds_%1$s
      for each row execute function public.ds_touch()$f$, t);

    -- keamanan: hanya akun yang sudah login (akun toko) yang boleh baca/tulis
    execute format('alter table public.ds_%1$s enable row level security', t);
    execute format('drop policy if exists ds_all on public.ds_%1$s', t);
    execute format($f$
      create policy ds_all on public.ds_%1$s for all to authenticated
      using (true) with check (true)$f$, t);

    -- realtime: perubahan langsung dikirim ke semua perangkat
    begin
      execute format('alter publication supabase_realtime add table public.ds_%1$s', t);
    exception when duplicate_object then null;
    end;
  end loop;
